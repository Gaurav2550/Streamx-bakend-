spring:
  application:
    name: streamx-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/streamx
    username: streamx
    password: change_me
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8081

jwt:
  secret: change-this-to-a-long-random-secret-key-for-streamx
  expiration: 86400000