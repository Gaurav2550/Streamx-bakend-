services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: streamx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: streamx
      POSTGRES_USER: streamx
      POSTGRES_PASSWORD: change_me

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: streamx-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: